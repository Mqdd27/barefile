<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="csrf" content="{{ csrf_token() }}">
<title>{% block title %}File Manager{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body{% if path is defined %} data-path="{{ path }}"{% endif %}>
<h1>File Manager</h1>
{% if session.user_id %}
<nav>
  <a href="{{ url_for('index') }}">Files</a>
  <a href="{{ url_for('trash_page') }}">Recycle Bin</a>
  <form method="post" action="{{ url_for('logout') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <button>Logout</button>
  </form>
</nav>
<section id="panel" hidden aria-live="polite">
  <b id="panel-title"></b>
  <div><progress id="panel-bar" value="0" max="1"></progress> <span id="panel-count"></span></div>
  <pre id="panel-output"></pre>
</section>
{% endif %}
{% block body %}{% endblock %}
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
